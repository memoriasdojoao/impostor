.chip{white-space:nowrap}

.seg{display:flex;background:var(--s2);border-radius:8px;padding:3px;gap:3px;margin:0 14px 14px}

function next(){if(s.i+1<s.n){s.i++;s.rv=false}else s.ph="ready";render()}
function ringCol(){return s.sec<=10?"#E5484D":s.sec/s.t<.34?"#E0B050":"#ECEAE4"}
function upd(){const t=$("tm");if(!t)return;t.textContent=fmt(s.sec);t.style.color=ringCol();const r=$("rg");r.setAttribute("stroke",ringCol());r.setAttribute("stroke-dashoffset",553*(1-s.sec/s.t))}
function tick(){s.sec--;if(s.sec<=0){s.sec=0;clearInterval(iv);s.run=false;try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}render()}else upd()}
function tog(){if(s.sec<=0)return;s.run=!s.run;clearInterval(iv);if(s.run)iv=setInterval(tick,1000);$("tg").innerHTML=s.run?ic("pause")+" "+T("pause"):ic("play")+" "+T("go")}
function pick(w){s.win=w;s.dl=s.sc.map((_,i)=>w==="crew"?(s.imp.includes(i)?0:1):(s.imp.includes(i)?2:0));s.sc=s.sc.map((v,i)=>v+s.dl[i]);save();render()}
var render=function(){
const M=$("main"),A=$("act");
$("top").innerHTML=`<img src="icon-192.png" alt=""><b>Impostor Médico</b><div class="sp">${s.ph==="lang"?"":`<button class="ib" id="lg" style="font:700 14px 'Barlow Condensed',sans-serif">${(s.lang||"es").toUpperCase()}</button>`}${["reveal","ready","discussion","result"].includes(s.ph)?`<span class="chip">${T("round")} ${s.round}</span>`:""}<button class="ib" id="sh">${ic("share",16)}</button></div>`;
on("sh",share);on("lg",()=>{s.ph="lang";render()});document.documentElement.lang=s.lang||"es";
const pct=(s.ph==="setup"||s.ph==="lang"||s.ph==="names")?0:s.ph==="reveal"?(s.i+(s.rv?1:0))/s.n*100:100;
$("prog").innerHTML=`<i style="width:${pct}%"></i>`;

if(s.ph==="lang"){
M.innerHTML=`<div class="ct in">${bean("#E5484D",84)}<h1>Impostor Médico</h1><div class="lb">Idioma · Language</div></div>`;
A.innerHTML=[["pt","Português"],["en","English"],["es","Español"]].map(x=>`<button class="btn ${s.lang===x[0]?"":"gh"}" data-l="${x[0]}">${x[1]}</button>`).join("");
A.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{s.lang=b.dataset.l;save();s.ph="setup";render()});
}else if(s.ph==="setup"){
const any=s.sc.some(v=>v>0);
M.innerHTML=`<div class="in"><div class="lb" style="margin-top:0">${T("game")}</div><div class="pn">
<div class="st">${ic("users")}<label>${T("players")}</label><div class="num"><button id="nd">−</button><span>${s.n}</span><button id="ni">+</button></div></div>
<div class="st">${bean("#E5484D",18)}<label>${T("imps")}</label><div class="num"><button id="kd">−</button><span>${s.k}</span><button id="ki">+</button></div></div>
<div class="st" style="border:0;padding-bottom:8px">${ic("bars")}<label>${T("diff")}</label></div><div class="seg">${Object.keys(LV).map(k=>`<button data-lv="${k}" class="${s.lv===k?"on":""}">${T(LV[k])}</button>`).join("")}</div>
<div class="st" style="border:0;padding-bottom:8px">${ic("clock")}<label>${T("time")}</label></div><div class="seg">${[60,90,120,180].map(x=>`<button data-t="${x}" class="${s.t===x?"on":""}">${fmt(x).replace(/^0/,"")}</button>`).join("")}</div>
</div><div class="row" style="margin-top:12px"><button class="btn gh sm" id="nms">${T("names")}</button>${any?`<button class="btn gh sm" id="rp">${T("resetp")}</button>`:""}</div></div>`;
A.innerHTML=`<button class="btn" id="go">${ic("play")} ${T("play")}</button>`;
on("nd",()=>{s.n=Math.max(4,s.n-1);fit();render()});on("ni",()=>{s.n=Math.min(14,s.n+1);fit();render()});
on("kd",()=>{s.k=Math.max(1,s.k-1);render()});on("ki",()=>{s.k=Math.min(maxK(),s.k+1);render()});
M.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{s.lv=b.dataset.lv;save();render()});
M.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{s.t=+b.dataset.t;save();render()});
on("nms",()=>{s.ph="names";render()});
on("rp",()=>{s.sc=s.sc.map(()=>0);s.round=0;save();render()});on("go",start);
}else if(s.ph==="names"){
M.innerHTML=`<div class="in"><div class="lb" style="margin-top:0">${T("namesT")}</div><div class="ro">${s.names.map((n,i)=>`<div>${bean(COL[i],24)}<input data-i="${i}" value="${isDef(n)?"":n.replace(/"/g,"&quot;")}" placeholder="${T("pl")} ${i+1}" maxlength="14"></div>`).join("")}</div></div>`;
A.innerHTML=`<button class="btn" id="a">${T("done")}</button>`;
M.querySelectorAll("input").forEach(e=>e.oninput=()=>{s.names[+e.dataset.i]=e.value;save()});on("a",()=>{s.ph="setup";render()});
}else if(s.ph==="reveal"){
const imp=s.imp.includes(s.i);
M.innerHTML=`<div class="ct in"><div class="lb">${T("pl")} ${s.i+1} ${T("of")} ${s.n}</div>${bean(COL[s.i],96)}<h1>${nm(s.i)}</h1>${!s.rv?`<p class="mu">${T("pass").replace("{x}",nm(s.i))}</p>`:imp?`<div class="card imp"><span class="tg r">${T("imp")}</span><div class="big">${T("nodiag")}</div><p>${T("impnote")}</p></div>`:`<div class="card"><span class="tg">${T("doc")}</span><div class="big">${DN()}</div><p>${T("docnote")}</p></div>`}</div>`;
A.innerHTML=!s.rv?`<button class="btn" id="a">${ic("eye")} ${T("seerole")}</button>`:`<button class="btn gh" id="a">${ic("eyeoff")} ${s.i+1<s.n?T("hidepass"):T("hidecont")}</button>`;
on("a",()=>{if(!s.rv){s.rv=true;render()}else next()});
}else if(s.ph==="ready"){
M.innerHTML=`<div class="ct in"><div class="lb">${T("rolesdone")}</div><div class="sq">${s.names.map((_,i)=>bean(COL[i],30)).join("")}</div>${!s.sr?`<h1>${T("allready")}</h1><p class="mu">${T("readyp")}</p>`:`<div class="lb" style="margin-top:10px">${T("opens")}</div>${bean(COL[s.st],104)}<h1>${nm(s.st)}</h1><p class="mu">${T("after")}</p>`}</div>`;
A.innerHTML=!s.sr?`<button class="btn" id="a">${ic("play")} ${T("start")}</button>`:`<button class="btn" id="a">${T("todebate")} ${ic("arrow")}</button>`;
on("a",()=>{if(!s.sr)s.sr=true;else s.ph="discussion";render()});
}else if(s.ph==="discussion"){
const f=s.sec/s.t;
M.innerHTML=`<div class="ct in"><div class="lb">${T("debate")}</div><div class="rg"><svg viewBox="0 0 200 200" width="220" height="220"><circle cx="100" cy="100" r="88" fill="none" stroke="#272B34" stroke-width="10"/><circle id="rg" cx="100" cy="100" r="88" fill="none" stroke="${ringCol()}" stroke-width="10" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="${553*(1-f)}" transform="rotate(-90 100 100)"/></svg><div class="tm" id="tm" style="color:${ringCol()}">${fmt(s.sec)}</div></div><span class="chip" style="color:var(--tx)">${T("opensS")} ${bean(COL[s.st],18)} ${nm(s.st)}</span><p class="mu">${s.sec===0?T("timeup"):T("hint")}</p></div>`;
A.innerHTML=`<div class="row"><button class="btn" id="tg">${s.run?ic("pause")+" Pausar":ic("play")+" Iniciar"}</button><button class="btn gh" id="rt" style="flex:0 0 58px">${ic("reset")}</button></div><button class="btn rd" id="vt">${T("vote")}</button>`;
on("tg",tog);on("rt",()=>{clearInterval(iv);s.sec=s.t;s.run=false;render()});on("vt",()=>{clearInterval(iv);s.run=false;s.ph="result";render()});
}else if(s.ph==="result"){
if(!s.rs){
M.innerHTML=`<div class="ct in"><div class="lb">${T("voting")}</div><h1>${T("who")}</h1><p class="mu">${T("votep")}</p></div>`;
A.innerHTML=`<button class="btn rd" id="a">${T("reveal")}</button>`;on("a",()=>{s.rs=true;render()});
}else if(s.win===null){
M.innerHTML=`<div class="in"><div class="lb" style="margin-top:0">${s.k>1?T("wereimps"):T("wasimp")}</div><div class="pn">${s.imp.map(i=>`<div class="st">${bean(COL[i],30)}<span class="nmx">${nm(i)}</span><span class="tg r">Impostor</span></div>`).join("")}</div><div class="lb">${T("diswas")}</div><div class="card"><span class="tg">${T("dx")}</span><div class="big">${DN()}</div></div><div class="lb">${T("whowon")}</div></div>`;
A.innerHTML=`<button class="btn gn" id="c">${T("docswon")} · +1</button><button class="btn rd" id="m">${s.k>1?T("impswon"):T("impwon")} · +2</button>`;
on("c",()=>pick("crew"));on("m",()=>pick("imp"));
}else{
const ord=s.sc.map((v,i)=>i).sort((a,b)=>s.sc[b]-s.sc[a]);
M.innerHTML=`<div class="in"><div class="lb" style="margin-top:0">${s.win==="crew"?T("docswon"):s.k>1?T("impswon"):T("impwon")}</div><div class="rb" style="grid-template-columns:repeat(${s.n>7?2:1},minmax(0,1fr))">${ord.map((i,r)=>`<div class="rw"><span class="rk" style="${r===0?"color:var(--gd)":""}">${r+1}</span>${bean(COL[i],s.n>7?22:28)}<span class="nmx">${nm(i)}</span>${s.dl[i]?`<span class="dl">+${s.dl[i]}</span>`:""}<span class="pt">${s.sc[i]}</span></div>`).join("")}</div></div>`;
A.innerHTML=`<button class="btn" id="a">${T("next")} ${ic("arrow")}</button><button class="btn gh" id="b">${T("menu")}</button>`;
on("a",start);on("b",()=>{s.ph="setup";render()});
}}
}
function fitScreen(){const M=$("main"),f=$("fit");if(!f)return;f.style.zoom=1;f.style.width="100%";f.style.minHeight="0";
const cs=getComputedStyle(M),av=M.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),hh=f.scrollHeight;f.style.minHeight="";
if(hh>av){const z=Math.max(.5,av/hh);f.style.zoom=z}}
const _r=render;render=function(){_r();const M=$("main"),w=document.createElement("div");w.id="fit";while(M.firstChild)w.appendChild(M.firstChild);M.appendChild(w);fitScreen()};
addEventListener("resize",fitScreen);addEventListener("orientationchange",()=>setTimeout(fitScreen,200));if(document.fonts)document.fonts.ready.then(fitScreen);
render();
if("serviceWorker" in navigator){const had=!!navigator.serviceWorker.controller;let rl=0;
navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!rl){rl=1;location.reload()}});
addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").then(r=>r.update()).catch(()=>{}))}
</script>
</body>
</html>
