<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Impostor">
<meta name="theme-color" content="#0C0D10">
<title>Impostor Médico</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0D10;--s1:#15171C;--s2:#1D2027;--ln:#272B34;--tx:#ECEAE4;--mu:#8B909C;--rd:#E5484D;--gn:#3DB07F;--gd:#E0B050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--tx);font-family:'Barlow',system-ui,sans-serif;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
#shell{height:100%;width:100%;overflow:hidden;max-width:480px;margin:0 auto;display:flex;flex-direction:column;border-inline:1px solid var(--ln)}
#top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
#top img{width:32px;height:32px;border-radius:8px}
#top b{font:700 20px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip{white-space:nowrap}
.btn{line-height:1.1;padding:0 10px}
@media(max-width:350px){#top b{font-size:17px;letter-spacing:.05em}}
.sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gd);border:1px solid var(--ln);padding:5px 9px;border-radius:6px;display:inline-flex;align-items:center;gap:6px}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);display:flex;align-items:center;justify-content:center}
#prog{height:3px;background:var(--ln)}#prog i{display:block;height:3px;background:var(--gd);transition:width .3s}
#main{flex:1;min-height:0;overflow:hidden;padding:10px 16px;width:100%;position:relative}
#fit{width:100%;min-height:100%;display:flex;flex-direction:column;justify-content:center;transform-origin:top left}
#act{padding:8px 16px 6px;display:flex;flex-direction:column;gap:10px}
#by{text-align:center;font-size:11px;color:var(--mu);padding:0 16px calc(10px + env(safe-area-inset-bottom))}#by a{color:var(--tx);text-decoration:none;font-weight:600}
.btn{font:700 20px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;height:54px;border-radius:10px;border:0;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;color:#0C0D10;background:var(--tx);box-shadow:0 4px 0 #8f8d87;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f8d87}
.btn.rd{background:var(--rd);color:#fff;box-shadow:0 4px 0 #8f2b2e}.btn.rd:active{box-shadow:0 1px 0 #8f2b2e}
.btn.gn{background:var(--gn);color:#06130d;box-shadow:0 4px 0 #226b4b}.btn.gn:active{box-shadow:0 1px 0 #226b4b}
.btn.gh{background:var(--s2);color:var(--tx);border:1px solid var(--ln);box-shadow:0 4px 0 #07080a}.btn.gh:active{box-shadow:0 1px 0 #07080a}
.row{display:flex;gap:10px}.row .btn{flex:1}
.pn{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.st{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln)}.st:last-child{border:0}
.st label,.st .nmx{flex:1;font-weight:600;font-size:15px}
.nmx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm{height:44px;font-size:17px}
.rb{display:grid;gap:6px;width:100%}.rw{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;min-width:0}.rw .nmx{flex:1;font-weight:600;font-size:14px}
.num{display:flex;align-items:center;gap:6px}.num button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font-size:18px}
.num span{width:28px;text-align:center;font:700 24px 'Barlow Condensed',sans-serif}
.seg{display:flex;background:var(--s2);border-radius:8px;padding:3px;gap:3px;margin:0 14px 14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font:600 15px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:8px 0;border-radius:6px}
.seg .on{background:var(--tx);color:#0C0D10}
.lb{font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:22px 2px 8px}
.ro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.ro div{min-width:0;display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:6px 10px}
.ro input{min-width:0;width:100%;flex:1;background:none;border:0;color:var(--tx);font:500 16px 'Barlow',sans-serif;outline:0}
.ct{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.ct .lb{margin:0}
.cd,h1{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;font-weight:700;margin:0}
h1{font-size:42px;line-height:1}
.mu{color:var(--mu);font-size:15px;line-height:1.5;margin:0;max-width:320px}
.card{width:100%;text-align:left;background:var(--tx);color:#0C0D10;border-radius:14px;padding:22px;animation:fl .35s ease-out}
.card.imp{background:#2A1417;border:1px solid var(--rd);color:var(--tx)}
.card p{margin:8px 0 0;font-size:14px;opacity:.7;line-height:1.45}
.tg{display:inline-block;font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:5px;background:var(--gn);color:#06130d}.tg.r{background:var(--rd);color:#fff}
.big{font:700 42px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:12px 0 2px;word-break:break-word}
.sq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:320px}
.rg{position:relative;width:220px;height:220px}
.tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 64px 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.rk{width:22px;font:700 20px 'Barlow Condensed',sans-serif;color:var(--mu)}
.pt{font:700 26px 'Barlow Condensed',sans-serif;color:var(--gd)}
.dl{font:700 14px 'Barlow Condensed',sans-serif;color:var(--gn);margin-right:6px}
.in{animation:up .3s ease-out}
@keyframes fl{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ln);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="shell"><div id="top"></div><div id="prog"></div><div id="main"></div><div id="act"></div><div id="by">Desenvolvido por <a href="https://www.instagram.com/cruzavam" target="_blank" rel="noopener">@cruzavam</a> · v6</div></div>
<div id="toast"></div>
<script>
const D={
facil:"Diabetes,Hipertensión,Asma,Migraña,Anemia,Varicela,Gripe,Neumonía,Apendicitis,Conjuntivitis,Amigdalitis,Otitis,Gastritis,Bronquitis,Sarampión,Dermatitis,Insomnio,Obesidad,Alergia alimentaria,Resfriado común,Covid-19,Dengue,Malaria,Tuberculosis,Hepatitis,Cáncer,Infarto,Depresión,Ansiedad,Rubéola,Paperas,Tos ferina,Cólera,Tétanos,Rabia,VIH/Sida,Herpes,Acné,Alopecia,Hemorroides,Estreñimiento,Diarrea,Intoxicación alimentaria,Cistitis,Hernia,Fractura,Esguince,Caries,Miopía,Lumbalgia,Ciática,Colesterol alto,Gota,Hipoglucemia,Deshidratación,Insolación,Mononucleosis,Zika,Polio,Derrame cerebral".split(","),
intermedio:"Artritis reumatoide,Hipotiroidismo,Hipertiroidismo,Osteoporosis,Colitis ulcerosa,Epilepsia,Cálculos renales,Úlcera péptica,Cirrosis hepática,Fibromialgia,Psoriasis,Vértigo posicional,Reflujo gastroesofágico,Tendinitis,Escoliosis,Sinusitis crónica,Varices,Cataratas,Glaucoma,Anorexia nerviosa".split(","),
dificil:"Lupus eritematoso,Esclerosis múltiple,Enfermedad de Crohn,Fibrosis quística,Síndrome de Guillain-Barré,Enfermedad de Parkinson,Enfermedad de Alzheimer,Miastenia gravis,Hemofilia,Anemia falciforme,Enfermedad de Wilson,Síndrome de Cushing,Enfermedad de Addison,Espondilitis anquilosante,Síndrome de Sjögren,Enfermedad de Graves,Amiloidosis,Porfiria".split(",")};
const LV={todas:"Todas",facil:"Fácil",intermedio:"Medio",dificil:"Difícil"};
const COL=["#D9534F","#4F7DF3","#3FAE6A","#E58AC1","#F09A3E","#E6D04F","#8C95A3","#E9EDF4","#8B5CF6","#9A6A3F","#35C9C0","#9BD94A","#B04A6E","#F0B7C6"];
const IC={users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',bars:'<path d="M12 20V10M18 20V4M6 20v-4"/>',share:'<path d="M12 16V4M7 9l5-5 5 5M5 21h14a2 2 0 0 0 2-2v-4M5 21a2 2 0 0 1-2-2v-4"/>',play:'<path d="M6 4l14 8-14 8z" fill="currentColor"/>',pause:'<path d="M7 4v16M17 4v16"/>',reset:'<path d="M1 4v6h6M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>',eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M17.9 17.9A10.9 10.9 0 0 1 12 20C5 20 1 12 1 12a18 18 0 0 1 5.1-5.9M9.9 4.2A10.7 10.7 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.2 3.2M1 1l22 22"/>',arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>'};
const ic=(n,z=18)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const sh=(x,y,w,h,r,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${c}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#000" opacity=".28"/>`;
const bean=(c,z=40)=>`<svg width="${z}" height="${z*1.1}" viewBox="0 0 40 44" style="flex:none">${sh(26,16,10,14,4,c)}${sh(9,34,8,9,3,c)}${sh(21,34,8,9,3,c)}<rect x="5" y="2" width="27" height="36" rx="13.5" fill="${c}"/><rect x="16" y="10" width="16" height="9" rx="4.5" fill="#BFE3EF"/><rect x="18" y="12" width="5" height="2.5" rx="1.2" fill="#fff" opacity=".8"/></svg>`;
const $=id=>document.getElementById(id);
const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
const KEY="impmed2";
let s={ph:"setup",n:10,k:1,lv:"todas",t:90,names:[],sc:[],round:0,i:0,rv:false,dis:"",imp:[],st:0,sr:false,sec:90,run:false,rs:false,win:null,dl:[]};
try{const p=JSON.parse(localStorage.getItem(KEY)||"{}");["n","k","lv","t","names","sc","round"].forEach(x=>{if(p[x]!==undefined)s[x]=p[x]})}catch(e){}
const maxK=()=>Math.max(1,Math.min(3,s.n-2));
function fit(){s.names=Array.from({length:s.n},(_,i)=>s.names[i]||"Jugador "+(i+1));s.sc=Array.from({length:s.n},(_,i)=>s.sc[i]||0);s.k=Math.min(s.k,maxK())}
function save(){try{localStorage.setItem(KEY,JSON.stringify({n:s.n,k:s.k,lv:s.lv,t:s.t,names:s.names,sc:s.sc,round:s.round}))}catch(e){}}
fit();
const nm=i=>(s.names[i]||"").trim()||"Jugador "+(i+1);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=x=>String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
let iv,tt;
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2000)}
function share(){const d={title:"Impostor Médico",text:"Juega Impostor Médico con nosotros. ¡Descubre quién es el impostor!",url:location.href};
if(navigator.share)navigator.share(d).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(d.url).then(()=>toast("Enlace copiado"));else prompt("Copia el enlace:",d.url)}
function start(){const pool=s.lv==="todas"?[].concat(D.facil,D.intermedio,D.dificil):D[s.lv];
s.dis=shuffle(pool)[0];s.imp=shuffle([...Array(s.n).keys()]).slice(0,s.k);s.st=Math.floor(Math.random()*s.n);
Object.assign(s,{ph:"reveal",i:0,rv:false,sr:false,sec:s.t,run:false,rs:false,win:null,dl:[]});s.round++;clearInterval(iv);save();render()}
function next(){if(s.i+1<s.n){s.i++;s.rv=false}else s.ph="ready";render()}
function ringCol(){return s.sec<=10?"#E5484D":s.sec/s.t<.34?"#E0B050":"#ECEAE4"}
function upd(){const t=$("tm");if(!t)return;t.textContent=fmt(s.sec);t.style.color=ringCol();const r=$("rg");r.setAttribute("stroke",ringCol());r.setAttribute("stroke-dashoffset",553*(1-s.sec/s.t))}
function tick(){s.sec--;if(s.sec<=0){s.sec=0;clearInterval(iv);s.run=false;try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}render()}else upd()}
function tog(){if(s.sec<=0)return;s.run=!s.run;clearInterval(iv);if(s.run)iv=setInterval(tick,1000);$("tg").innerHTML=s.run?ic("pause")+" Pausar":ic("play")+" Iniciar"}
function pick(w){s.win=w;s.dl=s.sc.map((_,i)=>w==="crew"?(s.imp.includes(i)?0:1):(s.imp.includes(i)?2:0));s.sc=s.sc.map((v,i)=>v+s.dl[i]);save();render()}
var render=function(){
const M=$("main"),A=$("act");
$("top").innerHTML=`<img src="icon-192.png" alt=""><b>Impostor Médico</b><div class="sp">${["reveal","ready","discussion","result"].includes(s.ph)?`<span class="chip">Ronda ${s.round}</span>`:""}<button class="ib" id="sh">${ic("share",16)}</button></div>`;
on("sh",share);
const pct=s.ph==="setup"?0:s.ph==="reveal"?(s.i+(s.rv?1:0))/s.n*100:100;
$("prog").innerHTML=`<i style="width:${pct}%"></i>`;

if(s.ph==="setup"){
const any=s.sc.some(v=>v>0);
M.innerHTML=`<div class="in"><div class="lb" style="margin-top:0">Partida</div><div class="pn">
<div class="st">${ic("users")}<label>Jugadores</label><div class="num"><button id="nd">−</button><span>${s.n}</span><button id="ni">+</button></div></div>
<div class="st">${bean("#E5484D",18)}<label>Impostores</label><div class="num"><button id="kd">−</button><span>${s.k}</span><button id="ki">+</button></div></div>
<div class="st" style="border:0;padding-bottom:8px">${ic("bars")}<label>Dificultad</label></div><div class="seg">${Object.keys(LV).map(k=>`<button data-lv="${k}" class="${s.lv===k?"on":""}">${LV[k]}</button>`).join("")}</div>
<div class="st" style="border:0;padding-bottom:8px">${ic("clock")}<label>Tiempo de debate</label></div><div class="seg">${[60,90,120,180].map(x=>`<button data-t="${x}" class="${s.t===x?"on":""}">${fmt(x).replace(/^0/,"")}</button>`).join("")}</div>
</div><div class="row" style="margin-top:12px"><button class="btn gh sm" id="nms">Nombres</button>${any?`<button class="btn gh sm" id="rp">Reiniciar puntos</button>`:""}</div></div>`;
A.innerHTML=`<button class="btn" id="go">${ic("play")} Jugar</button>`;
on("nd",()=>{s.n=Math.max(4,s.n-1);fit();render()});on("ni",()=>{s.n=Math.min(14,s.n+1);fit();render()});
on("kd",()=>{s.k=Math.max(1,s.k-1);render()});on("ki",()=>{s.k=Math.min(maxK(),s.k+1);render()});
M.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{s.lv=b.dataset.lv;save();render()});
M.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{s.t=+b.dataset.t;save();render()});
on("nms",()=>{s.ph="names";render()});
on("rp",()=>{s.sc=s.sc.map(()=>0);s.round=0;save();render()});on("go",start);
}else if(s.ph==="names"){
M.innerHTML=`<div class="in"><div class="lb" style="margin-top:0">Nombres de los jugadores</div><div class="ro">${s.names.map((n,i)=>`<div>${bean(COL[i],24)}<input data-i="${i}" value="${n.replace(/"/g,"&quot;")}" maxlength="14"></div>`).join("")}</div></div>`;
A.innerHTML=`<button class="btn" id="a">Listo</button>`;
M.querySelectorAll("input").forEach(e=>e.oninput=()=>{s.names[+e.dataset.i]=e.value;save()});on("a",()=>{s.ph="setup";render()});
}else if(s.ph==="reveal"){
const imp=s.imp.includes(s.i);
M.innerHTML=`<div class="ct in"><div class="lb">Jugador ${s.i+1} de ${s.n}</div>${bean(COL[s.i],96)}<h1>${nm(s.i)}</h1>${!s.rv?`<p class="mu">Pásale el teléfono a ${nm(s.i)}. Nadie más debe mirar la pantalla.</p>`:imp?`<div class="card imp"><span class="tg r">Impostor</span><div class="big">Sin diagnóstico</div><p>No conoces la enfermedad. Escucha, improvisa y no te delates.</p></div>`:`<div class="card"><span class="tg">Médico</span><div class="big">${s.dis}</div><p>Da pistas sin decir el nombre. Ayuda a descubrir al impostor.</p></div>`}</div>`;
A.innerHTML=!s.rv?`<button class="btn" id="a">${ic("eye")} Ver mi rol</button>`:`<button class="btn gh" id="a">${ic("eyeoff")} ${s.i+1<s.n?"Ocultar y pasar":"Ocultar y continuar"}</button>`;
on("a",()=>{if(!s.rv){s.rv=true;render()}else next()});
}else if(s.ph==="ready"){
M.innerHTML=`<div class="ct in"><div class="lb">Roles repartidos</div><div class="sq">${s.names.map((_,i)=>bean(COL[i],30)).join("")}</div>${!s.sr?`<h1>Todos listos</h1><p class="mu">Cuando todos estén atentos, toquen Comenzar para saber quién abre la ronda.</p>`:`<div class="lb" style="margin-top:10px">Abre la ronda</div>${bean(COL[s.st],104)}<h1>${nm(s.st)}</h1><p class="mu">Después se sigue en orden, hacia la derecha.</p>`}</div>`;
A.innerHTML=!s.sr?`<button class="btn" id="a">${ic("play")} Comenzar</button>`:`<button class="btn" id="a">Ir al debate ${ic("arrow")}</button>`;
on("a",()=>{if(!s.sr)s.sr=true;else s.ph="discussion";render()});
}else if(s.ph==="discussion"){
const f=s.sec/s.t;
M.innerHTML=`<div class="ct in"><div class="lb">Debate</div><div class="rg"><svg viewBox="0 0 200 200" width="220" height="220"><circle cx="100" cy="100" r="88" fill="none" stroke="#272B34" stroke-width="10"/><circle id="rg" cx="100" cy="100" r="88" fill="none" stroke="${ringCol()}" stroke-width="10" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="${553*(1-f)}" transform="rotate(-90 100 100)"/></svg><div class="tm" id="tm" style="color:${ringCol()}">${fmt(s.sec)}</div></div><span class="chip" style="color:var(--tx)">Abre ${bean(COL[s.st],18)} ${nm(s.st)}</span><p class="mu">${s.sec===0?"¡Tiempo! Voten ahora, a la cuenta de tres.":"Una pista por turno. Nadie dice el nombre de la enfermedad."}</p></div>`;
A.innerHTML=`<div class="row"><button class="btn" id="tg">${s.run?ic("pause")+" Pausar":ic("play")+" Iniciar"}</button><button class="btn gh" id="rt" style="flex:0 0 58px">${ic("reset")}</button></div><button class="btn rd" id="vt">Votar</button>`;
on("tg",tog);on("rt",()=>{clearInterval(iv);s.sec=s.t;s.run=false;render()});on("vt",()=>{clearInterval(iv);s.run=false;s.ph="result";render()});
}else if(s.ph==="result"){
if(!s.rs){
M.innerHTML=`<div class="ct in"><div class="lb">Votación</div><h1>¿Quién es el impostor?</h1><p class="mu">A la cuenta de tres, todos señalan a quien creen impostor. Después, revelen.</p></div>`;
A.innerHTML=`<button class="btn rd" id="a">Revelar</button>`;on("a",()=>{s.rs=true;render()});
}else if(s.win===null){

function fitScreen(){const M=$("main"),f=$("fit");if(!f)return;f.style.zoom=1;f.style.width="100%";f.style.minHeight="0";
const cs=getComputedStyle(M),av=M.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),hh=f.scrollHeight;f.style.minHeight="";
if(hh>av){const z=Math.max(.5,av/hh);f.style.zoom=z}}
const _r=render;render=function(){_r();const M=$("main"),w=document.createElement("div");w.id="fit";while(M.firstChild)w.appendChild(M.firstChild);M.appendChild(w);fitScreen()};
